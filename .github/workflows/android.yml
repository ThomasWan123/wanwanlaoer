name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify debug/release www assets parity
        run: ./gradlew verifyApkAssetsParity --no-daemon

      - name: Campaign balance audit
        run: node tools/audit-campaign-balance.mjs

      - name: Art manifest vs debug APK
        run: node tools/verify-art-manifest.mjs --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
